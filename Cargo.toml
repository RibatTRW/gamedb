[package]
name = "gamedb"
version = "1.0.0"
edition = "2021"
rust-version = "1.98"
description = "Index decompiled source into SQLite. Zero dependencies."

# No [dependencies] section at all, and that is the point:
#   - regex  : src/match.rs, hand-written; every class is ASCII by construction
#   - rusqlite: src/db.rs, linked against winsqlite3.dll (ships with Win10 1809+)
#   - clap   : src/cli.rs, hand-rolled
#   - serde  : src/cli.rs, a 20-line JSON string escaper
# Nothing to install, nothing to vendor, no build.rs.

[[bin]]
name = "gamedb"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
